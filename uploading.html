
<!DOCTYPE html>
<html lang="si">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | ICT Exam Hub LK</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .upload-container {
            max-width: 650px;
            width: 100%;
            padding: 45px 25px;
            background: var(--surface);
            border: 1px solid rgba(22, 185, 232, 0.2);
            border-radius: 20px;
        }

        .upload-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .upload-container h1 {
            color: var(--cyan);
            font-size: 30px;
            margin-bottom: 18px;
        }

        .upload-container p {
            color: var(--muted);
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .upload-status {
            color: var(--green);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: var(--surface-light);
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress {
            width: 35%;
            height: 100%;
            background: var(--cyan);
            border-radius: 20px;
            animation: loading 2s infinite alternate;
        }

        @keyframes loading {
            from {
                width: 20%;
            }

            to {
                width: 65%;
            }
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
        }

        @media (max-width: 500px) {
            .upload-container h1 {
                font-size: 23px;
            }

            .upload-icon {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="upload-container">

        <div class="upload-icon">📚</div>

        <h1>පාඩම් සටහන් සකස් කරමින් පවතී!</h1>

        <p>
            ඔබට අවශ්‍ය ICT පාඩම් සටහන්,
            කෙටි සටහන් සහ අධ්‍යාපනික සම්පත්
            ඉක්මනින්ම මෙම වෙබ් අඩවියට එක් කරනු ලැබේ.
        </p>

        <div class="upload-status">
            <span>●</span> Uploading Content...
        </div>

        <div class="progress-bar">
            <div class="progress"></div>
        </div>

        
<p>
    අප සමඟ රැඳී සිටින්න! ❤️<br>
</p>


        <a href="index.html" class="btn btn-primary back-btn">
            ← මුල් පිටුවට යන්න
        </a>

        <p style="margin-top: 30px; font-size: 13px;">
            Developed by Mahesh Nadun
        </p>

    </div>

</body>
</html>
